# Run everything:   docker compose up --build
# Website:          http://localhost:5200
# API + Swagger:    http://localhost:5012/swagger
#
# Optional settings go in a file called .env next to this one (see .env.example).

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-RaceDay_Passw0rd!}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      # The API waits for this, so it never starts before the database can answer
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Local stand-in for Azure Blob Storage (banners and profile pictures)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
    volumes:
      - blob-data:/data

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      # Development turns on Swagger. Remove this line for a production-style run.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sql;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD:-RaceDay_Passw0rd!};TrustServerCertificate=True;"
      Database__MigrateOnStartup: "true"
      # The API reaches storage over Docker's own network, by the service name "azurite".
      # (This is Azurite's published, well-known development key, not a secret.)
      AzureBlob__ConnectionString: "${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
      # Saved image links are opened by your BROWSER, which can't use the name "azurite",
      # so links are rewritten to localhost. Set this to empty when you use real Azure.
      AzureBlob__PublicBaseUrl: "${BLOB_PUBLIC_BASE_URL-http://localhost:10000/devstoreaccount1}"
    ports:
      - "5012:8080"

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "5200:8080"

volumes:
  sql-data:
  blob-data:
